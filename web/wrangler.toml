name = "voicemind-web"
main = ".open-next/worker.js"
compatibility_date = "2026-04-30"
compatibility_flags = ["nodejs_compat"]

# Custom domain
routes = [
  { pattern = "voice.aivolo.com", custom_domain = true }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# WhisperX Tunnel endpoint (public vars)
[vars]
WHISPERX_ENDPOINT = "https://whisperx.aivolo.com"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "voicemind-db"
database_id = "c125da73-f1d4-4246-b4f2-f4a8f9ad36cc"

# R2 Object Storage (audio files)
[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "voicemind-audio"

# Secrets (set via CLI, not in file):
# wrangler secret put CF_ACCESS_CLIENT_ID
# wrangler secret put CF_ACCESS_CLIENT_SECRET
# wrangler secret put GOOGLE_CLIENT_ID
# wrangler secret put GOOGLE_CLIENT_SECRET
# wrangler secret put JWT_SECRET
