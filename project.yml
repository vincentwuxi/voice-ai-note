name: VoiceAINote
options:
  bundleIdPrefix: com.voiceainote
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"

targets:
  VoiceAINote:
    type: application
    platform: iOS
    sources:
      - path: VoiceAINote
        excludes:
          - "**/*.xcassets"
          - "Info.plist"
    resources:
      - path: VoiceAINote/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voiceainote.app
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: VoiceAINote/Info.plist
      properties:
        CFBundleDisplayName: "灵思"
        CFBundleName: "VoiceMind"
        NSMicrophoneUsageDescription: "灵思需要访问麦克风来录制您的语音笔记，并通过 AI 将语音转换为结构化文字。"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    entitlements:
      path: VoiceAINote/VoiceAINote.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.voiceainote.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.voiceainote.app

schemes:
  VoiceAINote:
    build:
      targets:
        VoiceAINote: all
    run:
      config: Debug
    archive:
      config: Release
